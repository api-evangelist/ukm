- date: '2026-09-01'
  rating: 3
  summary: 'University-pipeline re-profile. Operator attribution was settled before anything was saved.
    No vendor contract had been misattributed to UKM in the June 2026 profile, so nothing had to be removed
    on that account — but the profile was also missing three of the four machine-readable surfaces UKM
    actually operates. Found and verified by probe: SSO@UKM, a SimpleSAMLphp SAML 2.0 identity provider
    at sso.ukm.my publishing unauthenticated metadata and demonstrably in production (libquest.ukm.my
    is a registered SP), though UKM is absent from eduGAIN while sixteen other Malaysian institutions
    are registered via SIFULAN; a second OAI-PMH 2.0 endpoint on the UKM e-Journal System (OJS 2.4.8.1,
    five metadata formats, 100 sets); and an open WordPress wp/v2 REST API with 314 routes on the main
    portal plus a second installation on Berita UKM. The already-known DSpace 6.3 OAI-PMH endpoint is
    now described rather than merely listed. Three Crossref memberships totalling 16,447 DOIs and a ROR
    registration were recorded as registry facts; Springshare LibGuides and a RemoteXs proxy were recorded
    as tenant relationships with no vendor contract saved. journalarticle.ukm.my remains unreachable on
    both ports, unchanged since June, and its dead pointers were removed while the surface itself was
    retained. UKM publishes no developer portal, documentation, OpenAPI, changelog, status page, robots.txt,
    sitemap, llms.txt or security.txt, and no AI policy was found in Malay or English. No endpoints were
    fabricated; every OpenAPI here was derived from live probes and is marked method: probed.'
