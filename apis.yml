aid: ukm
name: Universiti Kebangsaan Malaysia
x-type: university
x-category: Public Research University
description: >-
  Universiti Kebangsaan Malaysia (UKM), The National University of Malaysia, is a public research
  university in Bangi, Selangor, established 1970, ROR https://ror.org/00bw8d226. It publishes no
  developer portal, no API documentation, no OpenAPI, no changelog, no status page, no robots.txt,
  no sitemap.xml and no llms.txt — every one of those returns 404 on www.ukm.my. What it does
  operate, on its own domain and its own infrastructure, is four unauthenticated machine-readable
  surfaces that it has never described anywhere.

  The largest is its own identity provider: SSO@UKM at sso.ukm.my is a SimpleSAMLphp SAML 2.0 IdP
  publishing unauthenticated metadata with signing and encryption keys, SSO and SLO bindings and a
  technical contact, and it is demonstrably in production — the library's LibQuest service hands an
  unauthenticated visitor straight to it as SAML SP smuSSO-sp. UKM is nevertheless absent from
  eduGAIN; a scan of all 10,615 eduGAIN entities on 2026-09-01 found no ukm.my entity while sixteen
  other Malaysian institutions are registered through SIFULAN.

  The scholarly surfaces are two live OAI-PMH 2.0 endpoints run by Perpustakaan Tun Seri Lanang
  (the UKM Library): the DSpace 6.3 UKM Learning and Research Repository at ptsldigital.ukm.my with
  twelve metadata formats, and the OJS 2.4.8.1 UKM e-Journal System at ejournal.ukm.my with five
  formats and 100 sets — the latter never previously catalogued here. Both platforms are years past
  end of support. Behind them sits a real identifier footprint: three Crossref memberships owned by
  UKM units, led by UKM Press with prefix 10.17576 and 16,243 DOIs. A third repository,
  journalarticle.ukm.my, is registered in OpenDOAR and ROAR but has not answered on port 80 or 443
  across probes in June and September 2026.

  The fourth surface is incidental rather than intentional: UKM runs its web estate on self-hosted
  WordPress and leaves the wp/v2 REST API open for unauthenticated reads — 314 routes on the main
  portal, a second installation on the Berita UKM news site. It is the closest thing the university
  has to a public read API for its own content, and nothing about it is documented or governed.

  Nothing in this profile is a vendor contract attributed to UKM. Two vendor tenancies are recorded
  as relationships only — Springshare LibGuides and a RemoteXs e-resources proxy. No course
  catalog, open data portal, research computing or library discovery API was found; the GEMILANG
  discovery service did not answer.
