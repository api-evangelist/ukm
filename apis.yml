apis:
  - aid: ukm:identity-federation
    name: SSO@UKM — SAML 2.0 Identity Provider
    x-operator: institution
    description: >-
      Universiti Kebangsaan Malaysia's own SAML 2.0 identity provider, a SimpleSAMLphp deployment at
      sso.ukm.my. Publishes unauthenticated SAML 2.0 metadata (application/samlmetadata+xml, 4,261
      bytes) with an IDPSSODescriptor carrying separate signing and encryption X.509 keys,
      HTTP-Redirect SingleSignOnService and SingleLogoutService endpoints, the transient NameID
      format and a technical contact at server@ukm.edu.my. Confirmed in production: libquest.ukm.my
      redirects unauthenticated visitors to /saml2/idp/SSOService.php as SP smuSSO-sp. Three
      weaknesses are visible in the metadata itself — entityID is the bare string "sso.ukm.my"
      rather than a URI, the document is not XML-signed, and no validUntil or cacheDuration tells a
      relying party when to re-fetch. UKM is not registered in eduGAIN and does not appear under
      SIFULAN, so no federation operator is checking any of this on its behalf.
    humanURL: https://sso.ukm.my/
    baseURL: https://sso.ukm.my/saml2/idp
