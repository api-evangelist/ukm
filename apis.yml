x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated, machine-readable surfaces were found, probed and described, three of
    them for the first time: a SAML 2.0 identity provider at sso.ukm.my, an OAI-PMH 2.0 endpoint on
    the OJS e-Journal System, and an open WordPress wp/v2 REST API on two installations, alongside
    the already-known DSpace OAI-PMH endpoint, which is now described rather than merely listed.
    Three Crossref memberships (16,447 DOIs) and a ROR registration are recorded as registry facts.
    Two vendor tenancies — Springshare LibGuides and a RemoteXs e-resources proxy — are recorded as
    relationships, with no vendor contract saved. No vendor contract had previously been
    misattributed to UKM, so nothing had to be removed on that account.

    What UKM does not publish is as much of the finding. There is no developer portal, no API
    documentation, no OpenAPI, no changelog, no status page, no terms for automated access, no
    robots.txt, no sitemap.xml, no llms.txt and no .well-known/security.txt — all 404 on
    www.ukm.my. No course catalog, timetable, registrar, open data portal or research computing
    surface exists publicly; the library's GEMILANG discovery service did not answer; erep.ukm.my
    and libquest.ukm.my are behind SSO. A search of the portal in Malay and English found no AI
    policy or responsible-AI statement. Both scholarly platforms are years past end of support
    (DSpace 6.3, OJS 2.4.8.1), and a third repository, journalarticle.ukm.my, has been unreachable
    since at least June 2026 while its OpenDOAR record still calls it active — its dead pointers
    were removed here.

    Every OpenAPI in this repo was written by API Evangelist from live probes and is marked
    method: probed. UKM publishes none of its own.
