  - aid: ukm:web-content-rest
    name: UKM Web Content REST API (WordPress wp/v2)
    x-operator: institution
    description: >-
      UKM runs its web estate on self-hosted WordPress and leaves the wp/v2 REST API open for
      unauthenticated reads on its own domain. Two installations were verified live: the main
      portal at www.ukm.my/portal (discovery document 307 KB, 314 routes, 18 namespaces,
      authentication []) and the Berita UKM news site at www.ukm.my/beritaukm (225 KB). GET
      /wp/v2/pages, /wp/v2/media and /wp/v2/search all answer with JSON; /wp/v2/posts returns an
      empty array on the portal because the portal is built entirely from pages. The contract is
      WordPress's stock route set, not something UKM designed — the deployment is what is credited
      here. It is undocumented, ungoverned, carries no rate-limit header and no terms for automated
      access, and most of its eighteen namespaces are plugin-owned, so routes can appear or vanish
      on a plugin update. The host is intermittently slow: three of eleven probes on 2026-09-01
      timed out at 25-60 seconds.
